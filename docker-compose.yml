name: bios

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD env}
      POSTGRES_DB: ${POSTGRES_DB:-bios}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-bios}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./app/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-bios}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD env}@postgres:5432/${POSTGRES_DB:-bios}?schema=public
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      SERVER_CRYPTO_KEY_FILE: /run/secrets/server_crypto_key
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tauri.localhost}
      EMAIL_VERIFY_MX: ${EMAIL_VERIFY_MX:-true}
      SERVER_CRYPTO_KEY_ID: ${SERVER_CRYPTO_KEY_ID:-k1}
      SERVER_CRYPTO_OLD_KEYS: ${SERVER_CRYPTO_OLD_KEYS:-}
      SSH_ALLOWED_PORTS: ${SSH_ALLOWED_PORTS:-22}
      SSH_ALLOW_LOOPBACK: ${SSH_ALLOW_LOOPBACK:-false}
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      THROTTLE_SSH_OPS_LIMIT: ${THROTTLE_SSH_OPS_LIMIT:-6}
    secrets:
      - jwt_private_key
      - jwt_public_key
      - server_crypto_key

secrets:
  # Генерация ключа шифрования (32 байта, base64):
  #   openssl rand -base64 32 > secrets/server_crypto.key
  #   chmod 600 secrets/server_crypto.key
  # Потеря файла = все сохранённые SSH-секреты мертвы (бэкапить отдельно от БД).
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  server_crypto_key:
    file: ./secrets/server_crypto.key

volumes:
  pgdata:
